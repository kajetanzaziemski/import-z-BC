<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link rel="stylesheet" href="https://ssl.gstatic.com/docs/script/css/add-ons1.css">
    <style>
      /* add-ons1.css already sets Arial; only the size needs overriding */
      body {
        font-size: 13px;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 8px;
      }
      th, td {
        border: 1px solid #ccc;
        padding: 6px 8px;
        text-align: left;
      }
      th {
        background-color: #f1f3f4;
        font-weight: bold;
      }
      tr:nth-child(even) {
        background-color: #fafafa;
      }
      ul.triggers { padding-left: 16px; margin: 4px 0; }
      ul.triggers li { margin-bottom: 8px; }
      .warn {
        background: #fff2cc;
        border-left: 4px solid #f1c232;
        padding: 6px 8px;
      }
      #status {
        color: #888;
        font-style: italic;
      }
      #openNewWindow {
        display: inline-block;
        margin-bottom: 8px;
        font-size: 12px;
        color: #1a73e8;
        cursor: pointer;
        text-decoration: none;
      }
      #openNewWindow:hover {
        text-decoration: underline;
      }
      #openNewWindow.disabled {
        color: #aaa;
        pointer-events: none;
        cursor: default;
        text-decoration: none;
      }

      /* ---------- Tabs ---------- */
      .tab-bar {
        display: flex;
        border-bottom: 1px solid #ccc;
        margin-bottom: 10px;
      }
      .tab-btn {
        flex: 1;
        padding: 8px 6px;
        background: #f1f3f4;
        border: none;
        border-bottom: 3px solid transparent;
        cursor: pointer;
        font-size: 12px;
        font-family: inherit;
        text-wrap: wrap;
        white-space: normal;
        height: auto;
        text-align: center;
        line-height: 1.1;
        word-break: break-word;
      }
      .tab-btn:hover {
        background: #e8eaed;
      }
      .tab-btn.active {
        background: #ffffff;
        border-bottom: 3px solid #1a73e8;
        font-weight: bold;
      }
      .tab-panel {
        display: none;
      }
      .tab-panel.active {
        display: block;
      }

      /* ---------- Toggle switch ---------- */
      .switch {
        position: relative;
        display: inline-block;
        width: 60px;
        height: 34px;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        -webkit-transition: .4s;
        transition: .4s;
      }
      .slider:before {
        position: absolute;
        content: "";
        height: 26px;
        width: 26px;
        left: 4px;
        bottom: 4px;
        background-color: white;
        -webkit-transition: .4s;
        transition: .4s;
      }
      input:checked + .slider {
        background-color: #1a73e8; <!-- green: #60cf44 -->
      }
      input:focus + .slider {
        box-shadow: 0 0 1px #2196F3;
      }
      input:checked + .slider:before {
        -webkit-transform: translateX(26px);
        -ms-transform: translateX(26px);
        transform: translateX(26px);
      }
      .slider.round {
        border-radius: 34px;
      }
      .slider.round:before {
        border-radius: 50%;
      }
    </style>
    <script>
      /* =========================================================
         State
      ========================================================= */
      var triedRefresh = false; // guards against infinite agent-refresh loop

      /* =========================================================
         Utility helpers
      ========================================================= */
      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function isHtmlLink(str) {
        return /^\s*<a\s+href=.*?>.*<\/a>\s*$/i.test(String(str));
      }

      function formatCell(str) {
        if (isHtmlLink(str)) {
          // ensure links open in a new tab
          return String(str).replace(/<a\s+/i, '<a target="_blank" rel="noopener" ');
        }
        return escapeHtml(str);
      }

      function resetSaveButton(id) {
        var btn = document.getElementById(id);
        btn.innerHTML = "Zapisz zmiany";
        btn.disabled = false;
      }

      /* =========================================================
         Tabs
      ========================================================= */
      function selectTab(tabId) {
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.classList.toggle('active', panel.id === 'tab-' + tabId);
        });
        document.querySelectorAll('.tab-btn').forEach(function (btn) {
          btn.classList.toggle('active', btn.dataset.tab === tabId);
        });
        if (tabId === 'refresh') loadRefreshInfo();
      }

      /* =========================================================
         Auto-refresh tab (read when the tab is opened, by the refresh button and after the settings are applied; no polling)
      ========================================================= */
      var refreshLoadId = 0;          // only the answer to the latest call is shown

      function loadRefreshInfo() {
        var id = ++refreshLoadId;
        var btn = document.getElementById('reloadRefreshBtn');
        if (btn) { btn.disabled = true; btn.innerHTML = 'Odświeżanie…'; }
        google.script.run
          .withSuccessHandler(function (info) { if (id === refreshLoadId) showRefreshInfo(info); })
          .withFailureHandler(function (error) { if (id === refreshLoadId) showRefreshInfoError(error); })
          .getAutoRefreshInfo();
      }

      function showRefreshInfo(info) {
        var html = '';
        var btn = document.getElementById('reloadRefreshBtn');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Odśwież'; }
        if (info.current && info.current.foreign) {
          html += '<p class="warn">Odświeżanie ustawione przez innego użytkownika - poniższe informacje mogą zawierać błędy.</p>';
        }
        html += '<h1> Aktualne ustawienia: </h1>';
        if (info.error) {
          html += '<p class="gray">Nie udało się odczytać aktualnych ustawień.</p>';
        } else if (info.current) {
          html += '<p>Odświeżanie co: <b>' + escapeHtml(info.current.every) + '</b>' +
            (info.current.startAt ? ' (o ' + escapeHtml(info.current.startAt) + ')' : '') + '<br />' +
            'Następne odświeżenie: <b>' + escapeHtml(info.current.next) + '</b></p>';
        } else {
          html += '<p>Odświeżanie automatyczne jest wyłączone.</p>';
        }

        // changing the settings belongs to the current settings: the button right under them, with no header of its own
        var sh = info.sheet;
        if (!sh || !sh.available) {
          html += '<p class="gray">' + (sh && sh.error ? 'Nie udało się odczytać arkusza ustawień.' : 'Arkusz ustawień jeszcze nie istnieje.') + '</p>';
        } else {
          html += '<button class="action" id="applyRefreshBtn" onclick="applyRefreshSettings()"' + (sh.differs ? '' : ' disabled') + '> Ustaw wg. danych w arkuszu </button>';
          html += '<p class="gray">' + (sh.off
            ? '(odświeżanie wyłączone)'
            : '(odświeżanie co ' + escapeHtml(sh.every) + (sh.startAt ? ' o ' + escapeHtml(sh.startAt) : '') + '; nast. odśw. ' + escapeHtml(sh.next) + ')') + '</p>';
          if (!sh.differs) html += '<p class="gray">Ustawienia w arkuszu są takie same jak aktualne.</p>';
        }
        // switching it off on purpose (the settings in the sheet are cleaned, the trigger removed): a second press within 4 s confirms
        html += '<p><button id="turnOffRefreshBtn" onclick="turnOffRefresh()"' + (info.current ? '' : ' disabled') + '> Wyłącz autoodświeżanie </button></p>';
        html += '<div id="applyRefreshError"></div>';

        if (info.last) {
          html += '<h1> Ostatnio odświeżone: </h1><p>' + escapeHtml(info.last.at) +
            (info.last.duration ? '. Czas odświeżania: ' + escapeHtml(info.last.duration) : '') + '.</p>';
          if (info.last.sheets && info.last.sheets.length) {
            html += '<p>Odświeżone arkusze:</p><ul>' +
              info.last.sheets.map(function (n) { return '<li>' + escapeHtml(n) + '</li>'; }).join('') + '</ul>';
          }
        }

        html += '<hr /><h1> Arkusze, które odświeżasz automatycznie: </h1>' + renderTriggerList(info.triggers);
        // this document is refreshed by another user's trigger: it is not in the list, and the note says why
        if (info.current && info.current.foreign) {
          html += '<p><a href="#" onclick="showRefreshHelp(); return false;">Dlaczego nie widzę tego arkusza?</a></p>';
        }
        html += '<p class="gray">Strefa czasowa: ' + escapeHtml(info.zone) + '</p>';
        html += '<details><summary class="gray">Szczegóły techniczne</summary><pre style="white-space:pre-wrap;font-size:11px">' + escapeHtml(JSON.stringify(info.diag, null, 1)) + '</pre></details>';
        document.getElementById('refreshInfo-panel').innerHTML = html;
      }

      // All the user's time triggers: the document (a link), under it how often and when it was last refreshed. A trigger with no record shows what the trigger itself says.
      function renderTriggerList(list) {
        if (!list || list.error) return '<p class="gray">Nie udało się odczytać listy triggerów.</p>';
        if (!list.items.length) return '<p class="gray">Brak triggerów odświeżania.</p>';
        return '<ul class="triggers">' + list.items.map(function (t) {
          var title = t.name ? escapeHtml(t.name) : 'Nieznany arkusz';
          if (t.name && t.url) title = '<a href="' + escapeHtml(t.url) + '" target="_blank" rel="noopener">' + title + '</a>';
          var lines = [];
          lines.push('Odświeżanie co: ' + (t.every ? escapeHtml(t.every) : '<span class="gray">brak danych</span>'));
          lines.push('Ostatnio odświeżone: ' + (t.last ? escapeHtml(t.last) + (t.duration ? ' (' + escapeHtml(t.duration) + ')' : '') + (t.lastFromSheet ? ' <span class="gray">(wg arkusza)</span>' : '') : '<span class="gray">brak danych</span>'));
          if (!t.known) lines.push('<span class="gray">Trigger ' + escapeHtml(t.id) + ', funkcja ' + escapeHtml(t.handler) + (t.handler === 'autoRefresh' ? ' (stara wersja)' : '') + '</span>');
          return '<li><b>' + title + '</b>' + (t.here ? ' <span class="gray">(ten dokument)</span>' : '') + '<br />' + lines.join('<br />') + '</li>';
        }).join('') + '</ul>';
      }

      function showRefreshInfoError(error) {
        var btn = document.getElementById('reloadRefreshBtn');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Odśwież'; }
        document.getElementById('refreshInfo-panel').innerHTML =
          '<p id="status">Błąd pobierania danych: ' + escapeHtml(error.message) + '</p>';
      }

      function showRefreshHelp() {
        google.script.run
          .withFailureHandler(function (error) {
            var box = document.getElementById('applyRefreshError');
            if (box) box.innerHTML = "<font color='red'>Błąd: " + escapeHtml(error.message) + "</font>";
          })
          .showRefreshHelp();
      }

      var turnOffArmed = false;
      var turnOffTimer = null;

      function turnOffRefresh() {
        var btn = document.getElementById('turnOffRefreshBtn');
        if (!turnOffArmed) {
          turnOffArmed = true;
          btn.innerHTML = ' Na pewno? Kliknij ponownie ';
          if (turnOffTimer) clearTimeout(turnOffTimer);
          turnOffTimer = setTimeout(function () { turnOffArmed = false; var b = document.getElementById('turnOffRefreshBtn'); if (b) b.innerHTML = ' Wyłącz autoodświeżanie '; }, 4000);
          return;
        }
        turnOffArmed = false;
        if (turnOffTimer) clearTimeout(turnOffTimer);
        btn.disabled = true; btn.innerHTML = 'Wyłączanie...';
        google.script.run
          .withSuccessHandler(function () { loadRefreshInfo(); })
          .withFailureHandler(function (error) {
            loadRefreshInfo();
            var box = document.getElementById('applyRefreshError');
            if (box) box.innerHTML = "<font color='red'>Błąd: " + escapeHtml(error.message) + "</font>";
          })
          .turnOffRefresh();
      }

      function applyRefreshSettings() {
        var btn = document.getElementById('applyRefreshBtn');
        if (btn) { btn.disabled = true; btn.innerHTML = 'Ustawianie...'; }
        google.script.run
          .withSuccessHandler(function () { loadRefreshInfo(); })
          .withFailureHandler(function (error) {
            loadRefreshInfo();
            var box = document.getElementById('applyRefreshError');
            if (box) box.innerHTML = "<font color='red'>Błąd: " + escapeHtml(error.message) + "</font>";
          })
          .applyRefreshSettings();
      }

      /* =========================================================
         Addon status toggle
      ========================================================= */
      function refreshStatusInfo() {
        google.script.run
          .withSuccessHandler(showStatusToggle)
          .withFailureHandler(showStatusError)
          .getAddonStatus();
      }

      function statusChange(isChecked) {
        // if(isChecked) triedRefresh = true;
        google.script.run
          .withSuccessHandler(refreshAllInfo)
          .withFailureHandler(showStatusError)
          .changeAddonStatus(isChecked);
      }

      function showStatusToggle(data) {
        document.getElementById("statusInfo").innerHTML =
          '<label class="switch">' +
          '<input type="checkbox" ' + (data ? "checked" : "") + ' id="addonStatusSwitch" onchange="statusChange(this.checked)">' +
          '<span class="slider round"></span>' +
          '</label>';
      }

      function showStatusError(error) {
        document.getElementById("statusInfo").innerHTML =
          '<p id="status">Błąd wczytywania statusu: ' + escapeHtml(error.message) + '</p>';
      }

      /* =========================================================
         Agent status
      ========================================================= */
      function refreshAgentInfo() {
        google.script.run
          .withSuccessHandler(showAgentStatus)
          .withFailureHandler(showAgentError)
          .getAgentStatus();
      }

      function showAgentStatus(data) {
        var container = document.getElementById("agentStatus");
        if (data[0]) {
          container.innerHTML = "Konfiguracja poprawna";
        } else if (!data[1]) {
          container.innerHTML = "Konfiguracja niepełna. Włącz dodadetk, żeby odświeżyć konfigurację i rozpocząć pracę z dodatkiem.";
        } else if (!triedRefresh) {
          container.innerHTML = "Odświeżanie konfiguracji...";
          triedRefresh = true;
          agentRefresh();
        } else {
          container.innerHTML = "Konfiguracja niepełna. Odśwież konfigurację, żeby pracować z dodatkiem lub wyłącz dodatek.";
        }
      }

      function showAgentError(error) {
        document.getElementById("agentStatus").innerHTML =
          '<p id="status">Błąd pobierania danych: ' + escapeHtml(error.message) + '</p>';
      }

      function agentRefresh() {
        document.getElementById("forceAgentRefreshBtn").innerHTML = "Odświeżanie...";
        google.script.run
          .withSuccessHandler(afterAgentRefresh)
          .withFailureHandler(showAgentError)
          .forceAgentRefresh();
      }

      function afterAgentRefresh() {
        document.getElementById("forceAgentRefreshBtn").innerHTML = " Odśwież konfigurację ";
        refreshAllInfo();
      }

      /* =========================================================
         Import settings sheet name
      ========================================================= */
      function refreshImportSheetInfo() {
        google.script.run
          .withSuccessHandler(fillImportSheetName)
          .withFailureHandler(showImportSheetError)
          .getImportSettingsSheetName();
      }

      function fillImportSheetName(data) {
        document.getElementById('importSettingsSheetForm').importSettingsSheetName.value = data;
      }

      function showImportSheetError(error) {
        document.getElementById('sheetSettingsErrorDiv').innerHTML =
          "Błąd odświeżania nazwy arkusza: <font color='red'>" + escapeHtml(error.message) + "</font>";
      }

      function saveImportSheetName(form) {
        var btn = document.getElementById("sheetSettingsSubmit");
        btn.disabled = true;
        btn.innerHTML = "Zapisywanie...";
        google.script.run
          .withSuccessHandler(afterImportSheetSave)
          .withFailureHandler(afterImportSheetSaveFailure)
          .setImportSettingsSheetName(form.importSettingsSheetName.value);
      }

      function afterImportSheetSave() {
        document.getElementById('sheetSettingsSubmit').innerHTML = " Zapisano <font color='green'><bold>✓</bold></font>";
        document.getElementById('sheetSettingsErrorDiv').innerHTML = "";
        setTimeout(function () { resetSaveButton('sheetSettingsSubmit'); }, 2500);
        refreshAllInfo();
      }

      function afterImportSheetSaveFailure(error) {
        var btn = document.getElementById('sheetSettingsSubmit');
        btn.innerHTML = "Spróbuj zapisać ponownie";
        btn.disabled = false;
        document.getElementById('sheetSettingsErrorDiv').innerHTML =
          "Błąd zapisywania nazwy: <font color='red'>" + escapeHtml(error.message) + "</font>";
      }

      /* =========================================================
         Sheet of the download log
      ========================================================= */
      function refreshLogSheetInfo() {
        google.script.run
          .withSuccessHandler(function (name) { document.getElementById('logSheetForm').logSheetName.value = name; })
          .withFailureHandler(function (error) {
            document.getElementById('logSheetErrorDiv').innerHTML =
              "Błąd odświeżania nazwy arkusza: <font color='red'>" + escapeHtml(error.message) + "</font>";
          })
          .getRefreshLogSheetName();
      }

      function saveLogSheetName(form) {
        var btn = document.getElementById("logSheetSubmit");
        btn.disabled = true;
        btn.innerHTML = "Zapisywanie...";
        google.script.run
          .withSuccessHandler(function () {
            btn.innerHTML = " Zapisano <font color='green'><bold>✓</bold></font>";
            document.getElementById('logSheetErrorDiv').innerHTML = "";
            setTimeout(function () { resetSaveButton('logSheetSubmit'); }, 2500);
            refreshLogSheetInfo();
          })
          .withFailureHandler(function (error) {
            btn.innerHTML = "Spróbuj zapisać ponownie";
            btn.disabled = false;
            document.getElementById('logSheetErrorDiv').innerHTML =
              "Błąd zapisywania nazwy: <font color='red'>" + escapeHtml(error.message) + "</font>";
          })
          .setRefreshLogSheetName(form.logSheetName.value);
      }

      /* =========================================================
         Global settings (from Global Settings Side Bar.html)
      ========================================================= */
      function saveSettings(form) {
        var btn = document.getElementById(form.scope.value + 'Submit');
        btn.disabled = true;
        btn.innerHTML = "Zapisywanie...";
        google.script.run
          .withSuccessHandler(afterSave)
          .withFailureHandler(afterFailure)
          .withUserObject(form)
          .setGlobalSettings(form);
      }

      function afterSave(serverResponse, form) {
        document.getElementById(form.scope.value + 'Submit').innerHTML = " Zapisano <font color='green'><bold>✓</bold></font>";
        document.getElementById(form.scope.value + 'Div').innerHTML = "";
        setTimeout(function () { resetSaveButton(form.scope.value + 'Submit'); }, 2500);
      }

      function afterFailure(serverResponse, form) {
        var btn = document.getElementById(form.scope.value + 'Submit');
        btn.innerHTML = "Spróbuj zapisać ponownie";
        btn.disabled = false;
        document.getElementById(form.scope.value + 'Div').innerHTML = "<font color='red'>" + serverResponse.message + "</font>";
      }

      /* =========================================================
         Init
      ========================================================= */
      function refreshAllInfo() {
        refreshStatusInfo();
        refreshAgentInfo();
        refreshImportSheetInfo();
        refreshLogSheetInfo();
      }

      window.onload = refreshAllInfo;
    </script>
  </head>
  <body>
   <div class="sidebar">

    <div class="tab-bar">
      <button class="tab-btn active" data-tab="status" onclick="selectTab('status')">Ogólne</button>
      <button class="tab-btn" data-tab="help" onclick="selectTab('help')">Połączenie z BC</button>
      <button class="tab-btn" data-tab="refresh" onclick="selectTab('refresh')">Auto-odświeżanie</button>
    </div>

    <!-- ============ TAB 1: current sidebar content ============ -->
    <div id="tab-status" class="tab-panel active">
      <h1> Włącz / wyłącz "Import z BC" </h1>
      <div id="activeToggle">
        <p id="statusInfo"> Pobieranie danych... </p>
      </div>
      <hr />

      <h1> Arkusz ustawień importu </h1>
      <form onsubmit="event.preventDefault(); saveImportSheetName(this)" id='importSettingsSheetForm'>
        <div class="block form-group">
          <label for="importSettingsSheetName">Nazwa arkusza: </label>
          <input type="text" id="importSettingsSheetName" name="importSettingsSheetName" value="Pobieranie danych…"/>
        </div>
        <div id='sheetSettingsErrorDiv'> </div>
        <button type="submit" class="action" id="sheetSettingsSubmit"> Zapisz zmiany </button>
      </form>
      <hr />

      <h1> Arkusz dziennika pobrań </h1>
      <form onsubmit="event.preventDefault(); saveLogSheetName(this)" id='logSheetForm'>
        <div class="block form-group">
          <label for="logSheetName">Nazwa arkusza: </label>
          <input type="text" id="logSheetName" name="logSheetName" value="Pobieranie danych…"/>
        </div>
        <div id='logSheetErrorDiv'> </div>
        <button type="submit" class="action" id="logSheetSubmit"> Zapisz zmiany </button>
      </form>
      <hr />

      <h1> Stan konfiguracji: </h1>
      <div id="importSettings">
        <p id="agentStatus"> Pobieranie danych… </p>
      </div>
      <div class="block">
        <button id="forceAgentRefreshBtn" onclick="agentRefresh()"> Odśwież konfigurację </button>
        <p id="refreshInfo"> </p>
      </div>
    </div>

    <!-- ============ TAB 2: content of Global Settings Side Bar.html ============ -->
    <div id="tab-help" class="tab-panel">
      <h1> Ustawienia tego dokumentu </h1>
      <form onsubmit="event.preventDefault(); saveSettings(this)">
        <div class="block form-group">
          <label for="tenantid-document">Tenant Id</label>
          <input type="text" id="tenantid-document" name="tenantid" placeholder="Tenant Id" value="<?= getGlobalSettings().getTenantId("document") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="environment-document">Environment</label>
          <input type="text" id="environment-document" name="environment" placeholder="Environment" value="<?= getGlobalSettings().getBCEnvironment("document") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="company-document">Company</label>
          <input type="text" id="company-document" name="company" placeholder="Company" value="<?= getGlobalSettings().getCompany("document") ?? "" ?>"/>
        </div>
        <input type="hidden" name="scope" value="document" />
        <div id='documentDiv'> </div>
        <button type="submit" class="action" id="documentSubmit"> Zapisz zmiany </button>
      </form>
      <hr />

      <h1> Moje ustawienia </h1>
      <form onsubmit="event.preventDefault(); saveSettings(this)">
        <div class="block form-group">
          <label for="tenantid-user">Tenant Id</label>
          <input type="text" id="tenantid-user" name="tenantid" placeholder="Tenant Id" value="<?= getGlobalSettings().getTenantId("user") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="environment-user">Environment</label>
          <input type="text" id="environment-user" name="environment" placeholder="Environment" value="<?= getGlobalSettings().getBCEnvironment("user") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="company-user">Company</label>
          <input type="text" id="company-user" name="company" placeholder="Company" value="<?= getGlobalSettings().getCompany("user") ?? "" ?>"/>
        </div>
        <input type="hidden" name="scope" value="user" />
        <div id='userDiv'> </div>
        <button type="submit" class="action" id="userSubmit"> Zapisz zmiany </button>
      </form>
      <hr />

      <h1> Ustawienia organizacji (wszystkich użytkowników) </h1>
      <form onsubmit="event.preventDefault(); saveSettings(this)">
        <div class="block form-group">
          <label for="tenantid-script">Tenant Id</label>
          <input type="text" id="tenantid-script" name="tenantid" placeholder="Tenant Id" value="<?= getGlobalSettings().getTenantId("script") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="environment-script">Environment</label>
          <input type="text" id="environment-script" name="environment" placeholder="Environment" value="<?= getGlobalSettings().getBCEnvironment("script") ?? "" ?>"/>
        </div>
        <div class="block form-group">
          <label for="company-script">Company</label>
          <input type="text" id="company-script" name="company" placeholder="Company" value="<?= getGlobalSettings().getCompany("script") ?? "" ?>"/>
        </div>
        <input type="hidden" name="scope" value="script" />
        <div id='scriptDiv'> </div>
        <button type="submit" class="action" id="scriptSubmit"> Zapisz zmiany </button>
